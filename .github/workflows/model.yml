name: Prediction engine

# Retrains the prediction engine once a day on every tracked channel (yours and competitors'), then saves
# measured drivers, forecasts for videos under 30 days old and the engine's own accuracy. Takes ~1 minute.
# Also runs from the Actions tab ("Run workflow"), e.g. right after adding channels.
on:
  schedule:
    - cron: "41 20 * * *"   # 02:11 India time, when nothing else is busy
  workflow_dispatch: {}

concurrency:
  group: model
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-model.txt
      - run: python -m ytanalytics train
      - name: Detect lasting shifts and spikes in views and mood (Telegram + timeline pins)
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m ytanalytics changes
      # E5: our own Tanglish-aware mood model (sentence model + small trained head). Weekly is plenty; the
      # analyse step switches to it only when it agrees with the cloud AI at least as often as the default model.
      - name: Train the Tanglish mood model (Sundays, or when run by hand)
        continue-on-error: true
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(date -u +%u)" != "7" ]; then echo "Not Sunday: skipping"; exit 0; fi
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-ai.txt
          python -m ytanalytics tanglish-train
