name: Website

on:
  push:
    paths: ["web/**", "ytanalytics/db.py", ".github/workflows/web.yml"]
  pull_request:
    paths: ["web/**", "ytanalytics/db.py", ".github/workflows/web.yml"]

jobs:
  build-and-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: pw
          POSTGRES_DB: e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:pw@localhost:5432/e2e
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Create database tables (same code the background job uses)
        run: pip install -r requirements.txt && python -m ytanalytics init-db
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      - name: Type check
        working-directory: web
        run: npx tsc --noEmit
      - name: Production build
        working-directory: web
        run: npx next build
      - name: End-to-end test (live mode, history, AI, pages, security)
        working-directory: web
        run: node tests/e2e.mjs
