name: Sync & analyze

on:
  schedule:
    # Every 30 minutes (UTC). Public repositories get unlimited free GitHub Actions minutes.
    # IF THE REPOSITORY IS EVER MADE PRIVATE AGAIN (2,000 free minutes a month), first change this to
    # "7 */2 * * *" and below set RUNS_PER_DAY "12", MONTHLY_MINUTES_BUDGET "1700", MAX_WORK_MINUTES "25".
    - cron: "7,37 * * * *"
  workflow_dispatch: {}    # adds a "Run workflow" button in the Actions tab

# Never run two syncs at the same time.
concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ARCHIVE_DATABASE_URL: ${{ secrets.ARCHIVE_DATABASE_URL }}
      # Engine-stopped alarm (optional; same values as in Vercel)
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      SENTIMENT_MODEL: cardiffnlp/twitter-xlm-roberta-base-sentiment
      RUNS_PER_DAY: "48"
      MONTHLY_MINUTES_BUDGET: "0"     # 0 = no limit (public repository)
      MAX_WORK_MINUTES: "20"          # runs start every 30 minutes, so each finishes well within that
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Start timer
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Plan this run's minutes
        id: plan
        run: python -m ytanalytics plan | tee -a "$GITHUB_OUTPUT"

      - name: Fetch channels, videos and comments from YouTube
        run: python -m ytanalytics sync --until ${{ steps.plan.outputs.sync_until }}

      - name: Count comments waiting for analysis
        id: pending
        run: |
          echo "count=$(python -m ytanalytics pending)" >> "$GITHUB_OUTPUT"
          echo "topics=$(python -m ytanalytics topics-due)" >> "$GITHUB_OUTPUT"

      - name: Install sentiment model packages
        if: steps.pending.outputs.count != '0' || steps.pending.outputs.topics == '1'
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-ai.txt

      - name: Cache the AI models
        if: steps.pending.outputs.count != '0' || steps.pending.outputs.topics == '1'
        uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface
          key: hf-${{ env.SENTIMENT_MODEL }}-emo-minilm-v1
          restore-keys: hf-${{ env.SENTIMENT_MODEL }}

      - name: Sentiment and language for every new comment
        if: steps.pending.outputs.count != '0'
        run: python -m ytanalytics analyze --until ${{ steps.plan.outputs.analyze_until }}

      - name: Free local AI - emotions, questions, topic groups
        if: steps.pending.outputs.count != '0' || steps.pending.outputs.topics == '1'
        continue-on-error: true  # optional extras; never block the online AI step
        run: |
          A=${{ steps.plan.outputs.analyze_until }}; B=${{ steps.plan.outputs.ai_until }}
          python -m ytanalytics local-ai --until $(( A + (B - A) / 4 ))

      - name: AI deep analysis and insights (free Gemini / Mistral / Groq)
        run: python -m ytanalytics ai --until ${{ steps.plan.outputs.ai_until }}

      - name: Archive old analysed comments (only when the main database is getting full)
        if: env.ARCHIVE_DATABASE_URL != ''
        continue-on-error: true
        run: python -m ytanalytics archive --until $(( $(date +%s) + 300 ))

      - name: Record minutes used
        if: always()
        run: python -m ytanalytics record-job --started "$JOB_START" --status "${{ job.status }}" || true
