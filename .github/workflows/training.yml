name: Training channels

# Keeps the training database (Neon, separate from the dashboard's database) up to date: adds researched niche
# channels (data/training/*.json) and channels requested in the Model Lab, then refreshes their uploads and stats.
# Only channels, videos and young videos' view snapshots are stored: no comments. See ytanalytics/training.py.
on:
  schedule:
    - cron: "37 1,7,13,19 * * *"   # every 6 hours
  workflow_dispatch: {}

concurrency:
  group: training
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt
      - name: Add new channels (researched list + Model Lab requests)
        run: python -m ytanalytics training-seed --file data/training/tamil_channels.json
      - name: Refresh uploads and stats
        run: python -m ytanalytics training-sync --minutes 25
