name: Pulse Reader (our own comment model)

# Fine-tunes the Pulse Reader on comments the cloud AI already read (main + archive databases), checks it on a
# held-out 5% it never saw, and publishes it as a GitHub release. It only takes over if its mood agreement with the
# cloud AI isn't worse than the model in use; the analyse step then trusts each label only above the confidence
# measured to agree with the cloud AI 90% of the time. CPU only (public repo runners: 4 cores, 16 GB). See
# ytanalytics/reader.py and docs/RESEARCH_API_INDEPENDENCE.md.
on:
  schedule:
    - cron: "17 21 * * 6"   # Sunday 02:47 India time, weekly
  workflow_dispatch:
    inputs:
      max_train:
        description: "Training comments (more = better, slower)"
        default: "120000"
      max_minutes:
        description: "Training time budget in minutes"
        default: "200"

concurrency:
  group: reader
  cancel-in-progress: false

permissions:
  contents: write   # publish the model as a release asset

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ARCHIVE_DATABASE_URL: ${{ secrets.ARCHIVE_DATABASE_URL }}
      READER_MAX_TRAIN: ${{ inputs.max_train || '120000' }}
      READER_MAX_MINUTES: ${{ inputs.max_minutes || '200' }}
      PYTHONUNBUFFERED: "1"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install (CPU torch first)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-reader.txt
      - name: Train and test on the held-out comments
        run: python -m ytanalytics reader-train --out reader-out
      - name: Publish the model as a release
        id: publish
        run: |
          test -f reader-out/pulse-reader.tar.gz || { echo "No model produced"; exit 1; }
          TAG="pulse-reader-${{ github.run_number }}"
          gh release create "$TAG" reader-out/pulse-reader.tar.gz reader-out/metrics.json \
            --title "Pulse Reader #${{ github.run_number }}" --latest=false \
            --notes "Our own comment-reading model, trained $(date -u +%F). Held-out results are in metrics.json."
          echo "url=https://github.com/${{ github.repository }}/releases/download/$TAG/pulse-reader.tar.gz" >> "$GITHUB_OUTPUT"
      - name: Switch to it if it isn't worse than the current model
        run: python -m ytanalytics reader-save --out reader-out --url "${{ steps.publish.outputs.url }}"
      - name: Keep only the newest 3 model releases
        continue-on-error: true
        run: |
          IN_USE=$(python -m ytanalytics reader-status | python -c "import sys,json; u=json.load(sys.stdin).get('url') or ''; print(u.split('/download/')[-1].split('/')[0])")
          echo "In use: ${IN_USE:-none}"
          gh release list --limit 100 --json tagName --jq '.[].tagName' | grep '^pulse-reader-' | sort -t- -k3 -n -r \
            | tail -n +4 | grep -vx "${IN_USE:-__none__}" | while read -r t; do gh release delete "$t" --yes --cleanup-tag; done
      - name: Summary
        if: always()
        run: |
          echo '### Pulse Reader' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat reader-out/metrics.json >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "no metrics" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
