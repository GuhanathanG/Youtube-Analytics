name: Pulse Analyst (writing model on Kaggle)

# Trains our own small writing model on Kaggle's free GPU, privately: rebuilds (prompt -> cloud AI insight) pairs from
# the database, uploads them as a PRIVATE Kaggle dataset, runs kaggle/analyst_train.py in a PRIVATE GPU notebook, then
# downloads the result (a GGUF file that runs on CPU), publishes it as a release and records its test results.
# Needs GitHub secrets KAGGLE_USERNAME + KAGGLE_KEY (or KAGGLE_API_TOKEN). The Kaggle account must be phone-verified
# to use GPUs. Progress shows in the Model Lab's live view.
on:
  workflow_dispatch:
    inputs:
      epochs:
        description: "Training passes over the data"
        default: "2"
  schedule:
    - cron: "11 22 1,15 * *"   # twice a month; skips itself unless there are 10%+ more examples than last time

concurrency:
  group: analyst
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt kaggle
      - name: Check the Kaggle key
        id: who
        run: |
          if [ -z "$KAGGLE_KEY" ] && [ -z "$KAGGLE_API_TOKEN" ]; then
            echo "::error::Add the GitHub secrets KAGGLE_USERNAME and KAGGLE_KEY (Kaggle → Settings → API → Create New Token)."; exit 1
          fi
          python -m ytanalytics progress analyst start
          # Kaggle has two kinds of key: new API tokens (KAGGLE_API_TOKEN) and legacy keys (username + KAGGLE_KEY).
          # Try the saved key both ways and keep whichever Kaggle accepts.
          probe() { kaggle datasets list --mine >/tmp/probe.txt 2>&1 && ! grep -qi "authentication required" /tmp/probe.txt; }
          if [ -n "$KAGGLE_API_TOKEN" ] && probe; then echo "Kaggle: API token works"
          elif [ -n "$KAGGLE_KEY" ] && KAGGLE_API_TOKEN="$KAGGLE_KEY" probe; then
            mkdir -p ~/.kaggle && printf '%s' "$KAGGLE_KEY" > ~/.kaggle/access_token && chmod 600 ~/.kaggle/access_token
            echo "Kaggle: the saved key is a new-style API token"
          elif [ -n "$KAGGLE_KEY" ] && KAGGLE_API_TOKEN= probe; then echo "Kaggle: legacy key works"
          else
            tail -5 /tmp/probe.txt
            echo "::error::Kaggle refused the key. Create a new token at kaggle.com → Settings → API and save it as the KAGGLE_KEY secret."
            python -m ytanalytics progress analyst x --failed --note "Kaggle refused the key"; exit 1
          fi
          USER_NAME="${KAGGLE_USERNAME:-$(python -c 'from kaggle.api.kaggle_api_extended import KaggleApi as K; a=K(); a.authenticate(); print(a.get_config_value("username"))')}"
          [ -n "$USER_NAME" ] || { echo "::error::Couldn't tell the Kaggle username: add the KAGGLE_USERNAME secret."; python -m ytanalytics progress analyst x --failed --note "Kaggle username missing"; exit 1; }
          echo "user=$USER_NAME" >> "$GITHUB_OUTPUT"
      - name: Build the training pairs
        run: |
          python -m ytanalytics progress analyst "building training pairs from the cloud AI's video insights"
          python -m ytanalytics analyst-export --out analyst-data
          cat analyst-data/counts.json
      - name: Enough new examples to retrain?
        id: due
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.triggering_actor }}" != "github-actions[bot]" ]; then D=1; else D=$(python -m ytanalytics analyst-due --out analyst-data); fi
          echo "due=$D" >> "$GITHUB_OUTPUT"
          if [ "$D" = "0" ]; then python -m ytanalytics progress analyst x --done --note "Skipped: not enough new examples since the last model"; fi
      - name: Upload them as a private Kaggle dataset
        if: steps.due.outputs.due == '1'
        run: |
          U="${{ steps.who.outputs.user }}"
          printf '{"title": "Pulse Analyst data", "id": "%s/pulse-analyst-data", "licenses": [{"name": "other"}]}' "$U" > analyst-data/dataset-metadata.json
          python -m ytanalytics progress analyst "uploading the training pairs to Kaggle (private)"
          kaggle datasets version -p analyst-data -m "run ${{ github.run_number }}" --dir-mode zip 2>&1 | tee /tmp/ds.txt || true
          # Kaggle answers "403 Forbidden" (not 404) when the dataset doesn't exist yet: create it then.
          if grep -qiE "not found|404|403|forbidden|does not exist" /tmp/ds.txt; then kaggle datasets create -p analyst-data --dir-mode zip 2>&1 | tee /tmp/ds.txt; fi
          if grep -qiE "authentication required|unauthorized|forbidden|error" /tmp/ds.txt; then
            python -m ytanalytics progress analyst x --failed --note "Kaggle upload failed"; exit 1
          fi
          sleep 60   # Kaggle processes new dataset versions before notebooks can read them
      - name: Train on Kaggle's GPU (private notebook)
        if: steps.due.outputs.due == '1'
        run: |
          U="${{ steps.who.outputs.user }}"
          mkdir -p kernel && cp kaggle/analyst_train.py kernel/
          sed -i "s/os.environ.get(\"ANALYST_EPOCHS\", \"2\")/\"${{ inputs.epochs || '2' }}\"/" kernel/analyst_train.py
          printf '{"id": "%s/pulse-analyst", "title": "Pulse Analyst", "code_file": "analyst_train.py", "language": "python", "kernel_type": "script", "is_private": true, "enable_gpu": true, "enable_internet": true, "dataset_sources": ["%s/pulse-analyst-data"], "competition_sources": [], "kernel_sources": []}' "$U" "$U" > kernel/kernel-metadata.json
          kaggle kernels push -p kernel
          python -m ytanalytics progress analyst "training on Kaggle's T4 GPU (fine-tuning, testing, exporting)"
          start=$(date +%s)
          while true; do
            sleep 90
            S=$(kaggle kernels status "$U/pulse-analyst" 2>&1 | tail -1)
            echo "$S"
            MIN=$(( ($(date +%s) - start) / 60 ))
            python -m ytanalytics progress analyst "Kaggle: $(echo "$S" | sed -E 's/.*has status "?([A-Za-z_.]+)"?.*/\1/') · ${MIN} min" >/dev/null
            echo "$S" | grep -qiE 'complete' && break
            if echo "$S" | grep -qiE 'error|cancel'; then
              kaggle kernels output "$U/pulse-analyst" -p kaggle-out || true
              tail -c 3000 kaggle-out/*.log 2>/dev/null || true
              python -m ytanalytics progress analyst x --failed --note "Kaggle notebook stopped: $S"
              exit 1
            fi
            [ "$MIN" -gt 320 ] && { python -m ytanalytics progress analyst x --failed --note "Kaggle run took too long"; exit 1; }
          done
      - name: Download the model and publish it
        if: steps.due.outputs.due == '1'
        run: |
          U="${{ steps.who.outputs.user }}"
          kaggle kernels output "$U/pulse-analyst" -p analyst-out
          ls -la analyst-out
          cat analyst-out/metrics.json
          TAG="pulse-analyst-${{ github.run_number }}"
          gh release create "$TAG" analyst-out/pulse-analyst.gguf analyst-out/metrics.json analyst-out/samples.json \
            --title "Pulse Analyst #${{ github.run_number }}" --latest=false --notes "Our own writing model (GGUF, CPU). Test results in metrics.json."
          python -m ytanalytics analyst-save --out analyst-out --url "https://github.com/${{ github.repository }}/releases/download/$TAG/pulse-analyst.gguf"
          python -m ytanalytics progress analyst x --done --note "$(python -c "import json; m=json.load(open('analyst-out/metrics.json')); print(f\"valid JSON {m['valid_json']:.0%}, summary overlap with the cloud AI {m['summary_word_overlap']:.0%} on {m['test_pairs']} held-out videos\")")"
      - name: Summary
        if: always()
        run: |
          echo '### Pulse Analyst' >> "$GITHUB_STEP_SUMMARY"
          cat analyst-data/counts.json >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          cat analyst-out/metrics.json >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
